name: Backend CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ develop, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: retention_db
          POSTGRES_USER: retention_user
          POSTGRES_PASSWORD: retention_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U retention_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'
        cache-dependency-path: 'backend/pom.xml'

    - name: Build and Package with Maven
      env:
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/retention_db
        SPRING_DATASOURCE_USERNAME: retention_user
        SPRING_DATASOURCE_PASSWORD: retention_password
      run: |
        cd backend
        mvn clean package
