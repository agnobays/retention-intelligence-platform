services:
  postgres:
    image: postgres:16-alpine
    container_name: retention_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-retention_db}
      POSTGRES_USER: ${POSTGRES_USER:-retention_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retention_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-retention_user} -d ${POSTGRES_DB:-retention_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: retention_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-retention_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-retention_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-retention_password}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0"
    ports:
      - "80:8080"
      - "8080:8080"

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: retention_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

  prometheus:
    image: prom/prometheus:latest
    container_name: retention_prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:latest
    container_name: retention_grafana
    restart: always
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  postgres_data:
