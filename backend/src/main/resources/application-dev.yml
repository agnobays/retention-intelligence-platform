spring:
  datasource:
    url: jdbc:h2:mem:retention_db;DB_CLOSE_DELAY=-1;CASE_INSENSITIVE_IDENTIFIERS=TRUE;MODE=LEGACY
    username: retention_user
    password: retention_password
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console

camunda:
  bpm:
    database:
      type: h2
    generic-properties:
      properties:
        historyTimeToLive: P180D
