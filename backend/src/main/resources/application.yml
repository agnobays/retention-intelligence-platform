spring:
  application:
    name: retention-intelligence-platform
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  servlet:
    context-path: /api/v1

zeebe:
  client:
    broker:
      contact-point: ${ZEEBE_CLIENT_BROKER_CONTACTPOINT:127.0.0.1:26500}
    security:
      plaintext: true

jwt:
  secret: ${JWT_SECRET:eW91cl9zdXBlcl9zZWNyZXRfa3VhbGl0eV9qd3RfdG9rZW5fa2V5X2Zvcl9lbnRlcnByaXNl}
  expiration-ms: 86400000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
