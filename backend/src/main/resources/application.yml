spring:
  application:
    name: retention-intelligence-platform
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

camunda:
  bpm:
    auto-deployment-enabled: true
    deployment-resource-pattern: classpath*:**/*.bpmn
    webapp:
      index-redirect-enabled: true
    admin-user:
      id: admin
      password: adminpassword
      first-name: System
      last-name: Admin

server:
  port: 8080
  servlet:
    context-path: /api/v1

jwt:
  secret: ${JWT_SECRET:eW91cl9zdXBlcl9zZWNyZXRfa3VhbGl0eV9qd3RfdG9rZW5fa2V5X2Zvcl9lbnRlcnByaXNl}
  expiration-ms: 86400000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
