spring:
  application:
    name: retention-intelligence-platform
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  datasource:
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
  flyway:
    enabled: true
    locations: classpath:db/migration

camunda:
  bpm:
    auto-deployment-enabled: true
    deployment-resource-pattern: classpath*:**/*.bpmn
    webapp:
      index-redirect-enabled: true
    admin-user:
      id: ${CAMUNDA_ADMIN_ID:admin}
      password: ${CAMUNDA_ADMIN_PASSWORD:adminpassword_dev_only}
      first-name: System
      last-name: Admin

server:
  port: 8080
  servlet:
    context-path: ""

jwt:
  secret: ${JWT_SECRET:eW91cl9zdXBlcl9zZWNyZXRfa3VhbGl0eV9qd3RfdG9rZW5fa2V5X2Zvcl9lbnRlcnByaXNl}
  expiration-ms: 86400000

resend:
  api-key: ${RESEND_API_KEY:re_demo_key}
  from-email: ${RESEND_FROM_EMAIL:retention@agnoandfriends.com}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: retention-service

webhook:
  secret: ${WEBHOOK_SECRET:default_webhook_secret_dev_only}
